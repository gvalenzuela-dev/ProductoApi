version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: productos
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432" 
    networks:
      - products-net  

volumes:
  pgdata:

networks:
  products-net:
    driver: bridge